name: app_en
description: An anthology of English verse, indexed by poet.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  poemario_core:
    path: ../../packages/poemario_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  # App Store screenshots: `flutter test capturas/`.
  capturas_tienda:
    path: ../../packages/capturas_tienda
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    # The anthology, split: an index read at startup and the texts in chunks
    # read when a poem is shown (see poemario_core's PoemaRepository).
    - assets/poemas/
    - assets/poemas/textos/
    - assets/icon/shakespeare_transparente.png
    - assets/icon/shakespeare_transparente_claro.png
  # Fonts are bundled, not downloaded. This removes google_fonts, which
  # fetched Playfair and Lato over the network on first launch — so an
  # offline first run rendered the whole anthology in Roboto.
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-Italic.ttf
          style: italic
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/shakespeare_icono.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4A1426"
  adaptive_icon_foreground: "assets/icon/shakespeare_adaptativo.png"
  image_fill_color: "#4A1426"
  remove_alpha_ios: true
  background_color_ios: "#4A1426"

flutter_native_splash:
  color: "#4A1426"
  image: assets/icon/shakespeare_splash.png
  android: true
  ios: true
  android_12:
    color: "#4A1426"
    image: assets/icon/shakespeare_splash.png
    icon_background_color: "#4A1426"
