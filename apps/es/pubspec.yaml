name: app_es
description: Antología poética con índice por autor.
publish_to: 'none'
version: 1.1.0+10

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  poemario_core:
    path: ../../packages/poemario_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/poemas.json
    - assets/icon/gafas_bigote_transparente.png
    - assets/icon/gafas_bigote_transparente_claro.png
  # Fonts are bundled, not downloaded. This removes google_fonts, which
  # fetched Playfair and Lato over the network on first launch — so an
  # offline first run rendered the whole anthology in Roboto.
  #
  # These are the exact files google_fonts 8.0.2 downloaded in release 1.0.7
  # (same SHA-256 from fonts.gstatic.com), so the text looks identical to what
  # existing users already see. Do not swap in newer builds of the families:
  # Lato 2.x, for one, is redrawn and has different spacing.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/gafas_bigote_splash_mini.png"
  min_sdk_android: 21
  adaptive_icon_background: "#150e0e"
  adaptive_icon_foreground: "assets/icon/gafas_bigote_transparente.png"
  image_fill_color: "#150e0e"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#150e0e"
  image: assets/icon/gafas_bigote_splash.png
  android: true
  ios: true
  android_12:
    color: "#150e0e"
    image: assets/icon/gafas_bigote_splash.png
    icon_background_color: "#150e0e"
