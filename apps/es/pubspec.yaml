name: app_es
description: Antología poética con índice por autor.
publish_to: 'none'
version: 1.1.0+10

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  poemario_core:
    path: ../../packages/poemario_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/poemas.json
  # Fonts are bundled, not downloaded. This removes google_fonts, which
  # fetched Playfair and Lato over the network on first launch — so an
  # offline first run rendered the whole anthology in Roboto.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/gafas_bigote_splash_mini.png"
  min_sdk_android: 21
  adaptive_icon_background: "#150e0e"
  adaptive_icon_foreground: "assets/icon/gafas_bigote_splash_mini.png"
  image_fill_color: "#150e0e"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#150e0e"
  image: assets/icon/gafas_bigote_splash_mini.png
  android: true
  ios: true
  android_12:
    color: "#150e0e"
    image: assets/icon/gafas_bigote_splash_mini.png
    icon_background_color: "#150e0e"
